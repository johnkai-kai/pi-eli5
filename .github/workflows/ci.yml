name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      # 準備環境的步驟一律排在所有消費它的步驟之前。把安裝藏在 Type check 裡,
      # 其他步驟就看不到這些相依——pi-statusline-hud 曾為此紅了好幾個 commit 沒人發現。
      - name: Install dev dependencies
        run: npm install --no-save typescript @types/node @earendil-works/pi-coding-agent typebox
      - name: Unit tests
        run: npm test
      - name: Secret scan
        run: node scripts/scan-secrets.mjs
      - name: Type check
        run: npx tsc --noEmit
