name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      # Environment setup runs before everything that consumes it. Hiding the
      # install inside Type check leaves every other step without these deps.
      - name: Install dev dependencies
        run: npm install --no-save typescript @types/node @earendil-works/pi-coding-agent typebox
      - name: Unit tests
        run: npm test
      - name: Secret scan
        run: node scripts/scan-secrets.mjs
      - name: Type check
        run: npx tsc --noEmit
